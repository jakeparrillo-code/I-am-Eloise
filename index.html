<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I am Eloise.</title>
  
  <!-- Pink Bow Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 32 C22 18, 6 18, 8 32 C10 46, 24 40, 32 32 Z' fill='%23E0215A'/%3E%3Cpath d='M32 32 C42 18, 58 18, 56 32 C54 46, 40 40, 32 32 Z' fill='%23E0215A'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23B81445'/%3E%3C/svg%3E">

  <!-- Trendy Editorial & Clean Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF6F0;
      --card-white: #FFFFFF;
      --ink-black: #1A1A1A;
      --eloise-pink: #E0215A;
      --soft-blush: #F7D6E0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      background-image: radial-gradient(var(--soft-blush) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--ink-black);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1.25rem;
    }

    main {
      max-width: 440px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.8s ease-out;
    }

    .bow-badge {
      display: inline-block;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(2.6rem, 8vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink-black);
      margin-bottom: 1.75rem;
      line-height: 1.1;
    }

    h1 span {
      color: var(--eloise-pink);
    }

    .photo-frame {
      background: var(--card-white);
      padding: 14px 14px 36px 14px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(26, 26, 26, 0.10), 0 2px 6px rgba(26, 26, 26, 0.04);
      border: 1px solid rgba(224, 33, 90, 0.12);
      transform: rotate(-1.5deg);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    .photo-frame:hover {
      transform: rotate(0deg) translateY(-4px);
      box-shadow: 0 24px 48px rgba(224, 33, 90, 0.15);
    }

    .photo-frame img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      object-fit: cover;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <main>
    <div class="bow-badge" aria-hidden="true">
      <svg width="36" height="24" viewBox="0 0 64 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 21C21 6 4 6 6 21C8 36 23 30 32 21Z" fill="#E0215A"/>
        <path d="M32 21C43 6 60 6 58 21C56 36 41 30 32 21Z" fill="#E0215A"/>
        <circle cx="32" cy="21" r="5" fill="#B81445"/>
      </svg>
    </div>

    <h1>I am Eloise<span>.</span></h1>

    <div class="photo-frame">
      <img src="IMG_0474.JPG" alt="Eloise dressed up with a pink bow, white collared shirt, black skirt, and stuffed dog">
    </div>

    <footer>
      A Web Project by Eloise Parrillo.
    </footer>
  </main>
  </main>

</body>
</html>
